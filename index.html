  <meta name="twitter:card" content="summary">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Noodle Jump",
    "url": "https://jdeworks.github.io/noodle-jump/",
    "description": "Play Noodle Jump free in your browser: a pasta-themed endless jumper with seven zones, boss battles, daily challenges, and online multiplayer. No install, no signup.",
    "genre": "Platformer",
    "gamePlatform": "Web browser",
    "playMode": [
      "SinglePlayer",
      "MultiPlayer"
    ],
    "applicationCategory": "GameApplication",
    "operatingSystem": "Any operating system with a modern web browser",
    "isAccessibleForFree": true,
    "offers": {
      "@type": "Offer",
      "price": "0",

  <!-- SEO:END -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100dvh; /* dynamic viewport height — adapts when URL bar hides */
        overflow: hidden;
        overscroll-behavior: none;
        background: #fff8e7;
        touch-action: none;
      }
      #game {
        width: 100%;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 500px;
        max-height: 100dvh;
        aspect-ratio: 400 / 700;
        object-fit: contain;
        touch-action: none;
      }

      /* Fullscreen: lift width cap so canvas fills the screen (letterboxed) */
      :fullscreen #game,
      :-webkit-full-screen #game {
        background: #000;
      }
      :fullscreen canvas,
      :-webkit-full-screen canvas {
        max-width: 100%;
      }

      /* ── Orientation lock: show overlay when landscape ───────────────── */
      #rotate-message {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #1a1a2e;
        color: #fff;
        font-family: monospace;
        font-size: 20px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      #rotate-message .icon {
        font-size: 48px;
      }

      @media (orientation: landscape) and (max-height: 500px) {
        #rotate-message {
          display: flex;
        }
        #game {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate-message">
      <div class="icon">&#x1F4F1;</div>
      <div>Please rotate your device to portrait</div>
    </div>
    <noscript>
      <h1>Noodle Jump</h1>
      <p>
        Noodle Jump is a free pasta-themed endless jumper for your browser, with
        seven zones, boss battles, daily challenges, and online multiplayer.
        Enable JavaScript to play.
      </p>
      <p><a href="https://github.com/jdeworks/noodle-jump">Source code on GitHub</a></p>
    </noscript>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
