<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="screen-orientation" content="portrait" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍝</text></svg>" />
    <title>Noodle Jump</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100dvh; /* dynamic viewport height — adapts when URL bar hides */
        overflow: hidden;
        overscroll-behavior: none;
        background: #fff8e7;
        touch-action: none;
      }
      #game {
        width: 100%;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 500px;
        max-height: 100dvh;
        aspect-ratio: 400 / 700;
        object-fit: contain;
        touch-action: none;
      }

      /* ── Orientation lock: show overlay when landscape ───────────────── */
      #rotate-message {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #1a1a2e;
        color: #fff;
        font-family: monospace;
        font-size: 20px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      #rotate-message .icon {
        font-size: 48px;
      }

      @media (orientation: landscape) and (max-height: 500px) {
        #rotate-message {
          display: flex;
        }
        #game {
          display: none;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BlcF9OZu.js"></script>
  </head>
  <body>
    <div id="rotate-message">
      <div class="icon">&#x1F4F1;</div>
      <div>Please rotate your device to portrait</div>
    </div>
    <div id="game"></div>
  </body>
</html>
